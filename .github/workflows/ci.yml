name: CI

on:
  pull_request:
    paths:
      - "api-gateway/**"
      - "patient-service/**"
      - "history-service/**"
      - "assessment-service/**"
      - "front-app/**"
      - "libs/**"
      - "pom.xml"
      - ".github/workflows/**"
      - "platform/compose/**"
  push:
    branches: [ main ]
    paths:
      - "api-gateway/**"
      - "patient-service/**"
      - "history-service/**"
      - "assessment-service/**"
      - "front-app/**"
      - "libs/**"
      - "pom.xml"
      - ".github/workflows/**"
      - "platform/compose/**"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
      docker_services: ${{ steps.modules.outputs.docker_services }}
      has_changes: ${{ steps.modules.outputs.has_changes }}
      compose_changed: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - "api-gateway/**"
            patient-service:
              - "patient-service/**"
            history-service:
              - "history-service/**"
            assessment-service:
              - "assessment-service/**"
            front-app:
              - "front-app/**"
            libs:
              - "libs/**"
            root:
              - "pom.xml"
            compose:
              - "platform/compose/**"

      - name: Build dynamic matrices
        id: modules
        shell: bash
        run: |
          modules=()
          docker_services=()

          add_module() {
            modules+=("\"$1\"")
          }

          add_docker() {
            docker_services+=("\"$1\"")
          }

          if [[ "${{ steps.filter.outputs.libs }}" == "true" || "${{ steps.filter.outputs.root }}" == "true" ]]; then
            modules=("\"api-gateway\"" "\"patient-service\"" "\"history-service\"" "\"assessment-service\"" "\"front-app\"")
            docker_services=("\"api-gateway\"" "\"patient-service\"" "\"history-service\"" "\"assessment-service\"" "\"front-app\"")
          else
            [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && add_module "api-gateway" && add_docker "api-gateway"
            [[ "${{ steps.filter.outputs.patient-service }}" == "true" ]] && add_module "patient-service" && add_docker "patient-service"
            [[ "${{ steps.filter.outputs.history-service }}" == "true" ]] && add_module "history-service" && add_docker "history-service"
            [[ "${{ steps.filter.outputs.assessment-service }}" == "true" ]] && add_module "assessment-service" && add_docker "assessment-service"
            [[ "${{ steps.filter.outputs.front-app }}" == "true" ]] && add_module "front-app" && add_docker "front-app"
          fi

          if [[ ${#modules[@]} -eq 0 && "${{ steps.filter.outputs.compose }}" != "true" ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'modules=[]' >> "$GITHUB_OUTPUT"
            echo 'docker_services=[]' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
            echo "modules=[$(IFS=,; echo "${modules[*]}")]" >> "$GITHUB_OUTPUT"
            echo "docker_services=[$(IFS=,; echo "${docker_services[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  verify-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify changed module
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp -T1C -e -pl "${{ matrix.module }}" -am verify | tee "verify-${{ matrix.module }}.log"

      - name: Upload Maven logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs-${{ matrix.module }}
          path: verify-${{ matrix.module }}.log
          if-no-files-found: ignore

  build-docker:
    needs: [detect-changes, verify-java]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.docker_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.docker_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
