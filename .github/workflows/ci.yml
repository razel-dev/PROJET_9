name: CI Mono-Repo
env:
  SERVICES_CSV: 'api-gateway,patient-service,history-service,assessment-service'

on:
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'patient-service/**'
      - 'history-service/**'
      - 'assessment-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.github/workflows/**'
  push:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.set-outputs.outputs.changed }}
      build_all: ${{ steps.set-outputs.outputs.build_all }}
      any: ${{ steps.set-outputs.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - name: Détecter les changements
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            patient-service:
              - 'patient-service/**'
            history-service:
              - 'history-service/**'
            assessment-service:
              - 'assessment-service/**'
            libs:
              - 'libs/**'
            root:
              - 'pom.xml'
      - name: Préparer sorties
        id: set-outputs
        shell: bash
        run: |
          changed=""
          append() { if [ -z "$changed" ]; then changed="$1"; else changed="$changed,$1"; fi; }

          [ "${{ steps.filter.outputs.api-gateway }}" = "true" ] && append "api-gateway"
          [ "${{ steps.filter.outputs.patient-service }}" = "true" ] && append "patient-service"
          [ "${{ steps.filter.outputs.history-service }}" = "true" ] && append "history-service"
          [ "${{ steps.filter.outputs.assessment-service }}" = "true" ] && append "assessment-service"

          # Build complet sur push main ou si libs/pom changent
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ steps.filter.outputs.libs }}" = "true" ] || [ "${{ steps.filter.outputs.root }}" = "true" ]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$changed" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ steps.filter.outputs.libs }}" = "true" ] || [ "${{ steps.filter.outputs.root }}" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    # Une seule condition: au moins un module à construire, et ne lancer ce job
    # que pour les services modifiés (ou tous si build_all=true).
    if: needs.changes.outputs.any == 'true' && (needs.changes.outputs.build_all == 'true' || contains(format(',{0},', needs.changes.outputs.changed), format(',{0},', matrix.service)))
    strategy:
      fail-fast: false
      matrix:
        service: [ api-gateway, patient-service, history-service, assessment-service ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Afficher modules sélectionnés
        run: |
          echo "Services modifiés: ${{ needs.changes.outputs.changed }}"
          echo "Service courant: ${{ matrix.service }}"
      - name: Rendre le wrapper Maven exécutable
        run: chmod +x ./mvnw
      - name: Build (sélectif)
        shell: bash
        run: |
          MOD="${{ matrix.service }}"
          echo "Construction Maven du module: $MOD"
          set -o pipefail
          ./mvnw -B -e -T1C --no-transfer-progress -DskipTests=true -pl "$MOD" -am clean package | tee "build-${MOD//\//-}.log"
      - name: Publier logs Maven si échec (par module)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs-${{ matrix.service }}
          path: build-*.log
          if-no-files-found: ignore
