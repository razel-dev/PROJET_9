name: CI Mono-Repo
env:
  SERVICES: '["api-gateway","patient-service","history-service","assessment-service"]'
on:
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'patient-service/**'
      - 'history-service/**'
      - 'assessment-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.github/workflows/**'
  push:
    branches: [ main ]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      any: ${{ steps.set-matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - name: Détecter les changements
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            patient-service:
              - 'patient-service/**'
            history-service:
              - 'history-service/**'
            assessment-service:
              - 'assessment-service/**'
            libs:
              - 'libs/**'
            root:
              - 'pom.xml'
      - name: Préparer matrice
        id: set-matrix
        shell: bash
        run: |
          # Push sur main: on build tout
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "services=${{ env.SERVICES }}" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Construire en JSON robuste avec jq
          changed_json=$(jq -cn \
            --arg ag "${{ steps.filter.outputs.api-gateway }}" \
            --arg ps "${{ steps.filter.outputs.patient-service }}" \
            --arg hs "${{ steps.filter.outputs.history-service }}" \
            --arg as "${{ steps.filter.outputs.assessment-service }}" '
              [ ["api-gateway", $ag],
                ["patient-service", $ps],
                ["history-service", $hs],
                ["assessment-service", $as] ]
              | map(select(.[1]=="true")) | map(.[0]) ')

          # Si aucun service ciblé mais libs/root ont changé, tout builder
          if [ "$(jq -r 'length' <<<"$changed_json")" -eq 0 ]; then
            if [ "${{ steps.filter.outputs.libs }}" = "true" ] || [ "${{ steps.filter.outputs.root }}" = "true" ]; then
              echo "services=${{ env.SERVICES }}" >> "$GITHUB_OUTPUT"
              echo 'any=true' >> "$GITHUB_OUTPUT"
            else
              echo 'services=[]' >> "$GITHUB_OUTPUT"
              echo 'any=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "services=$changed_json" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi
  build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Afficher modules sélectionnés
        run: |
          echo "Services sélectionnés: ${{ needs.changes.outputs.services }}"
          echo "Service courant: ${{ matrix.service }}"
      - name: Rendre le wrapper Maven exécutable
        run: chmod +x ./mvnw
      - name: Build (sélectif)
        shell: bash
        run: |
          MOD="${{ matrix.service }}"
          echo "Construction Maven du module: $MOD"
          set -o pipefail
          ./mvnw -B -e -T1C --no-transfer-progress -DskipTests=true -pl "$MOD" -am clean package | tee "build-${MOD//\//-}.log"
      - name: Publier logs Maven si échec (par module)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs-${{ matrix.service }}
          path: build-*.log
          if-no-files-found: ignore
