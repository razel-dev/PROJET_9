<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="CONTENT - Medilabo">Medilabo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <meta name="theme-color" content="#0d6efd">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <div class="d-flex align-items-center gap-2">
            <a class="navbar-brand mb-0" th:href="@{/patients}">Medilabo</a>
            <button type="button" class="btn btn-outline-light btn-sm" onclick="history.back()">Retour</button>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a class="nav-link text-white" th:href="@{/patients}">Patients</a>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-light btn-sm">Se deconnecter</button>
            </form>
        </div>
    </div>
</nav>

<main class="container">
    <section layout:fragment="content"></section>
</main>

<footer class="mt-5 py-4 bg-white border-top">
    <div class="container text-muted small">
        (c) Medilabo
    </div>
</footer>

<script defer
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script defer th:src="@{/js/app.js}"></script>
</body>
</html>
