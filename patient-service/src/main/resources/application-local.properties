server.port=8084
spring.application.name=patient-service

# En local, MySQL écoute sur localhost 
spring.datasource.url=jdbc:mysql://localhost:3306/medilabo_patients?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Utilise les variables d'env si présentes, sinon valeurs par défaut ROOT/ROOTROOT
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
management.endpoints.web.exposure.include=health,info,prometheus

# Masquer les valeurs sensibles dans /actuator/env
management.endpoint.env.show-values=NEVER
management.endpoint.env.keys-to-sanitize=.*password$,.*username$,.*secret$,.*token$,.*key$,.*credential$